<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Emulator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #111;
      height: 100%;
    }
    #game {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <div id="game"></div>

  <script>
    // --- EmulatorJS config ---
    // Path to the folder containing this engine's assets (loader.js, cores, etc).
    window.EJS_pathtodata = "data/";

    // Core to run. "melonds" = Nintendo DS.
    window.EJS_core = "melonds";

    // Path to the ROM file.
    window.EJS_gameUrl = "roms/5298_-_Tomodachi_Collection_v1.1_JPN_NDS-iND.nds";

    // Shown in the loading screen / title bar.
    window.EJS_gameName = "Tomodachi Collection";

    // Element the emulator mounts into.
    window.EJS_player = "#game";
  </script>

  <script src="data/loader.js"></script>
</body>
</html>
